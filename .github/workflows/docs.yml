name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'conductor/**'
  pull_request:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'conductor/**'

jobs:
  check:
    name: Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --prefix docs-site --ignore-scripts
      - run: npm run check --prefix docs-site

  build:
    name: Docs Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --prefix docs-site --ignore-scripts
      - run: npm run build --prefix docs-site
