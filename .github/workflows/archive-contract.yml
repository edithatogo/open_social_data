name: Archive contract tests

on:
  pull_request:
    paths:
      - "scripts/archive_arcgis_feature_layer.py"
      - "scripts/write_hf_archive_receipt.py"
      - "tests/test_archive_arcgis_feature_layer.py"
      - ".github/workflows/archive-*.yml"
  push:
    branches: [main]
    paths:
      - "scripts/archive_arcgis_feature_layer.py"
      - "scripts/write_hf_archive_receipt.py"
      - "tests/test_archive_arcgis_feature_layer.py"
      - ".github/workflows/archive-*.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          version: "0.11.16"
      - name: Run archive contract tests
        run: >-
          uv run --no-project python -m unittest discover
          -s tests -p 'test_archive*.py'
      - name: Parse archive scripts
        run: >-
          uv run --no-project python -m py_compile
          scripts/archive_arcgis_feature_layer.py
          scripts/write_hf_archive_receipt.py
