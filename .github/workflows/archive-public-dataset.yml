name: Archive public dataset to Hugging Face

on:
  workflow_dispatch:
    inputs:
      source:
        description: Approved public source packet
        required: true
        default: stats-nz-meshblock-2026
        type: choice
        options:
          - stats-nz-meshblock-2026
          - stats-nz-subnational-population-2025
          - metro-christchurch-static-gtfs
          - auckland-transport-static-gtfs
      max_features:
        description: Zero captures the full frozen inventory; a positive value creates a bounded sample
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: public-dataset-archive-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: public-data-archive
    env:
      HF_DATASET_REPO: edithatogo/riopa-public-data-archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          version: "0.11.16"
      - name: Verify publication credential is configured
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: test -n "$HF_TOKEN"
      - name: Run archive contract tests
        run: >-
          uv run --no-project python -m unittest discover
          -s tests -p 'test_archive*.py'
      - name: Capture the approved source packet
        shell: bash
        run: |
          case "${{ inputs.source }}" in
            stats-nz-meshblock-2026)
              uv run --no-project python scripts/archive_arcgis_feature_layer.py \
                --output "$RUNNER_TEMP/hf-dataset" \
                --max-features "${{ inputs.max_features }}"
              ;;
            stats-nz-subnational-population-2025)
              test "${{ inputs.max_features }}" = "0"
              uv run --no-project python scripts/archive_stats_nz_population.py \
                --output "$RUNNER_TEMP/hf-dataset"
                ;;
            metro-christchurch-static-gtfs)
              test "${{ inputs.max_features }}" = "0"
              uv run --no-project python scripts/archive_public_url.py \
                --source-id metro-christchurch-static-gtfs \
                --url https://apis.metroinfo.co.nz/rti/gtfs/v1/gtfs.zip \
                --terms-url https://www.ecan.govt.nz/your-region/your-environment/our-responsibilities/transport/public-transport/public-transport-data/ \
                --output "$RUNNER_TEMP/hf-dataset/snapshots/metro-christchurch-static-gtfs"
              ;;
            auckland-transport-static-gtfs)
              test "${{ inputs.max_features }}" = "0"
              uv run --no-project python scripts/archive_public_url.py \
                --source-id auckland-transport-static-gtfs \
                --url https://at.govt.nz/media/1985/gtfs.zip \
                --terms-url https://at.govt.nz/about-us/at-data-sources/general-transit-feed-specification \
                --output "$RUNNER_TEMP/hf-dataset/snapshots/auckland-transport-static-gtfs"
              ;;
            *)
              echo "Unapproved source: ${{ inputs.source }}" >&2
              exit 1
              ;;
          esac
      - name: Add the governed dataset card
        run: cp publication/huggingface/riopa-public-data-archive/README.md "$RUNNER_TEMP/hf-dataset/README.md"
      - name: Verify packet checksums
        run: |
          manifest="$(find "$RUNNER_TEMP/hf-dataset/snapshots" -name manifest.json -print -quit)"
          manifest_dir="${manifest%/*}"
          cd "$manifest_dir"
          sha256sum --check checksums.sha256
      - name: Upload immutable packet to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          uv run --no-project --with huggingface_hub==1.15.0
          python scripts/publish_hf_archive.py upload-folder
          --repo "$HF_DATASET_REPO"
          --folder "$RUNNER_TEMP/hf-dataset"
          --message "Archive ${{ inputs.source }} from GitHub run $GITHUB_RUN_ID"
      - name: Resolve packet revision
        id: packet
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          revision="$(uv run --no-project --with huggingface_hub==1.15.0 python scripts/publish_hf_archive.py info --repo "$HF_DATASET_REPO")"
          manifest="$(find "$RUNNER_TEMP/hf-dataset/snapshots" -name manifest.json -print -quit)"
          {
            echo "revision=$revision"
            echo "manifest=$manifest"
            echo "checksums=${manifest%/*}/checksums.sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Bind hosted revision to GitHub execution
        run: >-
          uv run --no-project python scripts/write_hf_archive_receipt.py
          --dataset "$HF_DATASET_REPO"
          --revision "${{ steps.packet.outputs.revision }}"
          --manifest "${{ steps.packet.outputs.manifest }}"
          --output "$RUNNER_TEMP/receipt.json"
      - name: Upload hosted receipt
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          uv run --no-project --with huggingface_hub==1.15.0
          python scripts/publish_hf_archive.py upload-file
          --repo "$HF_DATASET_REPO"
          --file "$RUNNER_TEMP/receipt.json"
          --path "receipts/github/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          --message "Bind GitHub archive run $GITHUB_RUN_ID"
      - name: Record hosted evidence summary
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          final_revision="$(uv run --no-project --with huggingface_hub==1.15.0 python scripts/publish_hf_archive.py info --repo "$HF_DATASET_REPO")"
          {
            echo "## Public dataset archive"
            echo "- Dataset: https://huggingface.co/datasets/$HF_DATASET_REPO"
            echo "- Packet revision: ${{ steps.packet.outputs.revision }}"
            echo "- Receipt revision: $final_revision"
            echo "- Source: ${{ inputs.source }}"
            echo "- Maximum features: ${{ inputs.max_features }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain bounded workflow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-dataset-archive-evidence-${{ github.run_id }}
          path: |
            ${{ steps.packet.outputs.manifest }}
            ${{ steps.packet.outputs.checksums }}
            ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          retention-days: 90
